<section class="content">
  <div class="content-block">
    <div class="block-header">
      <app-breadcrumb
        [title]="'CLINIC.CALENDAR.TITLE' | translate"
        [items]="[('MENUITEMS.CLINIC.TEXT' | translate)]"
        [active_item]="'CLINIC.CALENDAR.TITLE' | translate"
      ></app-breadcrumb>
    </div>
    <div class="card">
      <div class="card-body">
        <span class="d-block small text-muted">{{ 'CLINIC.CALENDAR.HINT' | translate }}</span>
        <div class="clinic-calendar__legend">
          @for (doctor of doctors; track doctor.doctorId; let index = $index) {
            <mat-checkbox [checked]="isShown(doctor)" (change)="toggleDoctor(doctor, $event.checked)">
              <span class="clinic-calendar__swatch" [style.background-color]="colorAt(index)"></span>
              {{ doctorLabel(doctor) }}
            </mat-checkbox>
          }
        </div>
        @if (loadFailed) {
          <span class="d-block mb-2 small text-danger">{{ 'CLINIC.CALENDAR.LOAD_FAILED' | translate }}</span>
        }
        <div class="panel-body calendar-panel">
          <full-calendar [options]="calendarOptions"></full-calendar>
        </div>
      </div>
    </div>
  </div>
</section>
