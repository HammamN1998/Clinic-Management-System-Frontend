<section class="content">
  <div class="content-block">
    <div class="block-header">
      <app-breadcrumb
        [title]="'CLINIC.DASHBOARD.TITLE' | translate"
        [items]="[('MENUITEMS.CLINIC.TEXT' | translate)]"
        [active_item]="'CLINIC.DASHBOARD.TITLE' | translate"
      ></app-breadcrumb>
    </div>

    <!-- Needs attention -->
    <div class="card">
      <div class="header">
        <h2><strong>{{ 'CLINIC.DASHBOARD.ATTENTION.TITLE' | translate }}</strong></h2>
      </div>
      <div class="body">
        @for (item of attentionItems; track $index) {
          <a
            class="clinic-dashboard__attention d-flex align-items-center gap-2 py-2 text-decoration-none"
            [class.border-top]="!$first"
            routerLink="/clinic/doctors"
          >
            <mat-icon class="flex-shrink-0">{{ item.icon }}</mat-icon>
            <span>{{ item.key | translate: item.params }}</span>
          </a>
        } @empty {
          <span class="small text-muted">{{ 'CLINIC.DASHBOARD.ATTENTION.EMPTY' | translate }}</span>
        }
      </div>
    </div>
  </div>
</section>
