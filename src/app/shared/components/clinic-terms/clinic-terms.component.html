<dl class="clinic-terms">
  <div class="clinic-terms__row">
    <dt>{{ 'CLINIC.TERMS.COMMISSION' | translate }}</dt>
    <dd>{{ 'CLINIC.TERMS.COMMISSION_VALUE' | translate: { percent: terms.commissionPercent } }}</dd>
  </div>
  @if (terms.notes) {
    <div class="clinic-terms__row">
      <dt>{{ 'CLINIC.TERMS.NOTES' | translate }}</dt>
      <dd class="clinic-terms__notes">{{ terms.notes }}</dd>
    </div>
  }
</dl>
